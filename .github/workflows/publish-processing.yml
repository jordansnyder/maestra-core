name: Publish Processing SDK (GitHub Release)

on:
  push:
    tags:
      - 'processing/v*'

permissions:
  contents: write  # Needed to create releases

env:
  # Compile-time dependencies. Bump these as upstream releases move.
  PROCESSING_VERSION: "4.3"
  PROCESSING_BUILD: "processing-1296-4.3"
  MQTT_LIB_VERSION: "1.7.0"  # 256dpi/processing-mqtt

jobs:
  publish:
    name: Build and release Processing library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#processing/v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches library.properties
        run: |
          MANIFEST="$(grep '^prettyVersion=' sdks/processing/MaestraClient/library.properties | cut -d= -f2)"
          TAG="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::Tag version ($TAG) != library.properties prettyVersion ($MANIFEST)"
            exit 1
          fi
          echo "Version OK: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch Processing core.jar
        run: |
          curl -fsSL -o processing.tgz \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_BUILD}/processing-${PROCESSING_VERSION}-linux-x64.tgz"
          tar xzf processing.tgz
          CORE="$(find . -path '*/core/library/core.jar' | head -1)"
          [ -n "$CORE" ] || { echo "::error::core.jar not found in Processing archive"; exit 1; }
          echo "PROCESSING_CORE_JAR=$PWD/$CORE" >> "$GITHUB_ENV"

      - name: Fetch processing-mqtt library
        run: |
          curl -fsSL -o mqtt.zip \
            "https://github.com/256dpi/processing-mqtt/releases/download/v${MQTT_LIB_VERSION}/mqtt.zip"
          unzip -q mqtt.zip -d mqtt-lib
          MQTT="$(find mqtt-lib -name 'mqtt.jar' | head -1)"
          [ -n "$MQTT" ] || { echo "::error::mqtt.jar not found in processing-mqtt archive"; exit 1; }
          echo "MQTT_JAR=$PWD/$MQTT" >> "$GITHUB_ENV"

      - name: Build library
        run: |
          chmod +x sdks/processing/MaestraClient/build.sh
          sdks/processing/MaestraClient/build.sh
          ls -lh sdks/processing/MaestraClient/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Processing SDK v${{ steps.version.outputs.version }}"
          body: |
            ## Maestra Processing Library — v${{ steps.version.outputs.version }}

            ### Installation
            1. Download and extract `MaestraClient-${{ steps.version.outputs.version }}.zip`
            2. Copy the `MaestraClient/` folder into your Processing **sketchbook/libraries/** directory
            3. Also install **MQTT** via *Sketch → Import Library → Manage Libraries*
            4. Restart Processing — `import maestra.*;` is now available

            See the [Processing guide](https://maestra.cc/docs) for usage.
          files: |
            sdks/processing/MaestraClient/dist/MaestraClient-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
