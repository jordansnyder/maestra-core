name: Check SDK Versions

# Guards against the 9 SDK manifests drifting to different versions. Runs on any
# change under sdks/ or to the version tooling.
on:
  pull_request:
    paths:
      - 'sdks/**'
      - 'scripts/check-sdk-versions.sh'
      - 'scripts/bump-sdk-version.sh'
      - '.github/workflows/check-sdk-versions.yml'
  push:
    branches: [main, develop]
    paths:
      - 'sdks/**'
      - 'scripts/check-sdk-versions.sh'
      - 'scripts/bump-sdk-version.sh'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify all SDK manifests share one version
        run: bash scripts/check-sdk-versions.sh
